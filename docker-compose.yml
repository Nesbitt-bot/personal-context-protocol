services:
  app:
    container_name: personal-context-protocol-app-v${PCP_VERSION:-0.3.1}
    mem_limit: 1g
    image: personal-context-protocol:${PCP_VERSION:-0.3.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${PCP_VERSION:-0.3.1}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pcp:${POSTGRES_PASSWORD:-pcp_local_password}@db:5432/pcp?sslmode=disable}
      PCP_INSTANCE_SECRET: ${PCP_INSTANCE_SECRET:-local-compose-secret-change-me-32chars}
      PCP_APP_URL: ${PCP_APP_URL:-http://localhost:3000}
      PCP_ADMIN_TOKEN: ${PCP_ADMIN_TOKEN:-}
      # Casdoor OIDC sign-in. Login stays disabled until all six are set.
      PCP_OIDC_ISSUER: ${PCP_OIDC_ISSUER:-}
      PCP_OIDC_CLIENT_ID: ${PCP_OIDC_CLIENT_ID:-}
      PCP_OIDC_CLIENT_SECRET: ${PCP_OIDC_CLIENT_SECRET:-}
      PCP_OIDC_REDIRECT_URI: ${PCP_OIDC_REDIRECT_URI:-}
      PCP_OIDC_REQUIRED_GROUP: ${PCP_OIDC_REQUIRED_GROUP:-}
      PCP_OIDC_ADMIN_GROUP: ${PCP_OIDC_ADMIN_GROUP:-}
      # Legacy admin-token UI login; disabled unless explicitly set to 1.
      PCP_BREAK_GLASS_ADMIN_LOGIN: ${PCP_BREAK_GLASS_ADMIN_LOGIN:-}
      NODE_ENV: production
    ports:
      # Loopback by default; put a TLS reverse proxy in front for remote use.
      - "${PCP_PORT:-127.0.0.1:3000}:3000"
    labels:
      org.opencontainers.image.version: ${PCP_VERSION:-0.3.1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PCP broker (AstrBot -> PCP -> OpenClaw). Same image, separate process.
  # Host networking because the OpenClaw gateway listens on host loopback;
  # the broker itself binds 127.0.0.1 only and refuses anything else. Never
  # publish it or route it through a tunnel. Started only with the "broker"
  # profile (deploy.sh enables it when the secrets directory exists).
  broker:
    profiles: ["broker"]
    container_name: personal-context-protocol-broker-v${PCP_VERSION:-0.3.1}
    image: personal-context-protocol:${PCP_VERSION:-0.3.1}
    command: ["node", "broker/server.js"]
    network_mode: host
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    environment:
      PCP_BROKER_HOST: 127.0.0.1
      PCP_BROKER_PORT: ${PCP_BROKER_PORT:-3101}
      # The app's loopback port (PCP_PORT) and the gateway's loopback port.
      PCP_BROKER_PCP_URL: ${PCP_BROKER_PCP_URL:-http://127.0.0.1:3000}
      PCP_BROKER_OPENCLAW_URL: ${PCP_BROKER_OPENCLAW_URL:-http://127.0.0.1:18789}
    volumes:
      # broker.token (PCP broker credential) and openclaw-gateway.token, mode
      # 600; never in the repository or the image.
      - type: bind
        source: ${PCP_BROKER_SECRETS_DIR:-/home/motuariki/Documents/DockerVolumes/pcp/broker-secrets}
        target: /run/secrets/pcp-broker
        read_only: true
        bind:
          create_host_path: false
    labels:
      org.opencontainers.image.version: ${PCP_VERSION:-0.3.1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PCP_BROKER_PORT||3101)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    container_name: personal-context-protocol-db-v${PCP_VERSION:-0.3.1}
    mem_limit: 512m
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcp
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcp_local_password}
    volumes:
      # Persistent data lives in a host bind mount, never in a named volume or
      # the container layer. Override with PCP_POSTGRES_DATA_DIR. The directory
      # must already exist (owner 70:70, the image's postgres user, mode 700);
      # Compose never creates it, and deploy/jenkins/check_storage.sh refuses to
      # start an empty one while the legacy named volume still holds data.
      - type: bind
        source: ${PCP_POSTGRES_DATA_DIR:-/home/motuariki/Documents/DockerVolumes/pcp/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      org.opencontainers.image.version: ${PCP_VERSION:-0.3.1}
    restart: unless-stopped

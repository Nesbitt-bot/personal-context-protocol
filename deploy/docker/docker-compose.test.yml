# Throwaway PCP stack for verifying a change end-to-end before deploying.
#
# This is deliberately separate from the root docker-compose.yml:
#   - it never touches the root stack's named volume, so a test run cannot
#     destroy local data;
#   - the database is tmpfs-backed, so every run starts from an empty schema
#     and exercises the real bootstrap path;
#   - the admin token is fixed, so a test script can authenticate without
#     scraping it out of the build logs.
#
# Usage (from the repository root):
#   docker compose -f deploy/docker/docker-compose.test.yml up -d --build
#   node deploy/docker/test-session-sync.mjs
#   docker compose -f deploy/docker/docker-compose.test.yml down -v

name: pcp-test

services:
  app:
    image: personal-context-protocol:test
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_VERSION: "test"
        # Overridable so a machine that cannot reach Docker Hub can build
        # against a node image it already has cached.
        NODE_IMAGE: "${PCP_TEST_NODE_IMAGE:-node:20-bookworm-slim}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pcp:pcp_test_password@db:5432/pcp?sslmode=disable
      PCP_INSTANCE_SECRET: pcp-test-instance-secret-at-least-32-chars
      PCP_APP_URL: http://localhost:${PCP_TEST_PORT:-3100}
      # Fixed so the test script can authenticate deterministically. This value
      # is local-only and never reaches a real deployment.
      PCP_ADMIN_TOKEN: pcp-test-admin-token-at-least-32-characters
      NODE_ENV: production
    ports:
      - "${PCP_TEST_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcp
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: pcp_test_password
    # In-memory: a test database must not survive the run.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

services:
  executor:
    image: pcp-executor:1.0.0
    container_name: pcp-executor
    build:
      context: ../broker
      dockerfile: Dockerfile.executor
    network_mode: host
    environment:
      PCP_URL: http://127.0.0.1:3000
      EXECUTION_IMAGE: python:3.12-slim
      EXECUTION_WORKSPACE_ROOT: /home/motuariki/Documents/DockerVolumes/pcp/group-workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /home/motuariki/Documents/DockerVolumes/pcp/group-workspaces
        target: /home/motuariki/Documents/DockerVolumes/pcp/group-workspaces
        bind:
          create_host_path: false
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3103/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
